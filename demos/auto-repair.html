  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

g:1px;text-transform:uppercase\">Redline <span style=\"color:#F26722\">Auto Works<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:26px;font-weight:600;font-size:15px\">\n    <a href=\"#services\" style=\"color:#B8BEC2\">Services<\u002Fa>\n    <a href=\"#why\" style=\"color:#B8BEC2\">Why Us<\u002Fa>\n    <a href=\"#reviews\" style=\"color:#B8BEC2\">Reviews<\u002Fa>\n    <a href=\"#quote\" style=\"background:#F26722;color:#0F1011;font-weight:700;padding:11px 22px;transform:skewX(-8deg)\" style-hover=\"background:#fff;color:#0F1011\"><span style=\"display:inline-block;transform:skewX(8deg)\">GET A FREE QUOTE<\u002Fspan><\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- Hero -->\n<header style=\"position:relative;background:linear-gradient(95deg,rgba(15,16,17,.96) 42%,rgba(15,16,17,.55)),url(&quot;b32cbc20-eaae-4842-b720-1b539e29f27f&quot;) center/cover\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:80px 5vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:50px;align-items:center\">\n    <div>\n      <div style=\"animation:heroUp .8s ease both;display:inline-block;background:rgba(242,103,34,.15);border:1px solid rgba(242,103,34,.5);color:#F79B6A;font-weight:700;font-size:13px;letter-spacing:2px;padding:8px 16px;text-transform:uppercase\">ASE-Certified · Phoenix, AZ<\u002Fdiv>\n      <h1 style=\"animation:heroUp .8s .1s ease both;font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(42px,5.6vw,70px);line-height:1.04;margin:20px 0 18px;text-transform:uppercase\">Dealer-level repair. <span style=\"color:#F26722\">Neighborhood-shop honesty.<\u002Fspan><\u002Fh1>\n      <p style=\"animation:heroUp .8s .2s ease both;color:#B8BEC2;font-size:18px;line-height:1.65;margin:0 0 30px;max-width:520px\">Diagnostics, brakes, engines and everything between — with photos of what we find and a written quote before we turn a single wrench.<\u002Fp>\n      <div style=\"animation:heroUp .8s .3s ease both;display:flex;gap:30px;flex-wrap:wrap\">\n        <sc-for list=\"{{ heroStats }}\" as=\"h\">\n          <div><div style=\"font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;color:#F26722\">{{ h.val }}<\u002Fdiv><div style=\"font-size:13.5px;color:#8B9297;font-weight:600\">{{ h.label }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Quote form -->\n    <div id=\"quote\" style=\"animation:heroUp .9s .25s ease both;background:#1E2123;border-top:4px solid #F26722;padding:30px;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n      <sc-if value=\"{{ formIdle }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;text-transform:uppercase;margin-bottom:4px\">Get a free quote<\u002Fdiv>\n        <div style=\"color:#8B9297;font-size:14.5px;margin-bottom:20px\">We reply within 30 minutes during shop hours.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n          <input value=\"{{ fName }}\" onchange=\"{{ setName }}\" placeholder=\"Your name\" style=\"grid-column:span 2;background:#161819;border:1px solid #33383B;color:#E8EAEB;padding:13px 14px;font-size:15px;outline:none\">\n          <input value=\"{{ fPhone }}\" onchange=\"{{ setPhone }}\" placeholder=\"Phone number\" style=\"background:#161819;border:1px solid #33383B;color:#E8EAEB;padding:13px 14px;font-size:15px;outline:none\">\n          <input value=\"{{ fVehicle }}\" onchange=\"{{ setVehicle }}\" placeholder=\"Year / Make / Model\" style=\"background:#161819;border:1px solid #33383B;color:#E8EAEB;padding:13px 14px;font-size:15px;outline:none\">\n          <select value=\"{{ fService }}\" onchange=\"{{ setService }}\" style=\"grid-column:span 2;background:#161819;border:1px solid #33383B;color:#E8EAEB;padding:13px 14px;font-size:15px;outline:none\">\n            <option value=\"\">What does it need?<\u002Foption>\n            <option>Check engine light / diagnostics<\u002Foption>\n            <option>Brakes<\u002Foption>\n            <option>Oil change &amp; maintenance<\u002Foption>\n            <option>AC / heating<\u002Foption>\n            <option>Engine or transmission<\u002Foption>\n            <option>Something else<\u002Foption>\n          <\u002Fselect>\n          <textarea value=\"{{ fNotes }}\" onchange=\"{{ setNotes }}\" placeholder=\"Tell us what's going on (noises, leaks, warning lights...)\" rows=\"3\" style=\"grid-column:span 2;background:#161819;border:1px solid #33383B;color:#E8EAEB;padding:13px 14px;font-size:15px;outline:none;resize:vertical\"><\u002Ftextarea>\n          <button onclick=\"{{ submitForm }}\" style=\"grid-column:span 2;background:#F26722;color:#0F1011;border:none;cursor:pointer;font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;letter-spacing:1.5px;text-transform:uppercase;padding:15px\" style-hover=\"background:#fff\">Send my quote request →<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"color:#6C7378;font-size:12.5px;margin-top:12px\">No spam, ever. Or call us at <a href=\"tel:6025550147\" style=\"font-weight:700\">(602) 555-0147<\u002Fa><\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ formDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:36px 10px;animation:slideIn .4s ease\">\n          <div style=\"width:64px;height:64px;border-radius:50%;background:rgba(74,190,120,.15);border:2px solid #4ABE78;display:grid;place-items:center;margin:0 auto 18px\">\n            <span style=\"width:30px;height:30px;background:#4ABE78;-webkit-mask:url(&quot;28e82bae-5f0f-4639-851b-fa4316824331&quot;) center/contain no-repeat;mask:url(&quot;28e82bae-5f0f-4639-851b-fa4316824331&quot;) center/contain no-repeat\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;text-transform:uppercase\">Request received!<\u002Fdiv>\n          <p style=\"color:#8B9297;font-size:15px;line-height:1.6;margin:10px 0 20px\">Thanks {{ doneName }} — a service advisor is looking at it now. Expect a text with your quote within 30 minutes.<\u002Fp>\n          <button onclick=\"{{ resetForm }}\" style=\"background:transparent;border:1px solid #33383B;color:#B8BEC2;cursor:pointer;font:inherit;font-weight:600;font-size:14px;padding:11px 20px\" style-hover=\"border-color:#F26722;color:#F26722\">Send another request<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- Services -->\n<section id=\"services\" style=\"max-width:1240px;margin:0 auto;padding:90px 5vw\">\n  <div data-reveal=\"\" style=\"margin-bottom:46px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px\">\n    <div>\n      <div style=\"color:#F26722;font-weight:700;font-size:13px;letter-spacing:2.5px;text-transform:uppercase\">Full-service shop<\u002Fdiv>\n      <h2 style=\"font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(32px,4vw,48px);margin:8px 0 0;text-transform:uppercase\">What we fix<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"color:#8B9297;font-size:15px;max-width:380px\">All makes and models, foreign and domestic. 3-year / 36,000-mile nationwide warranty on parts and labor.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2px;background:#33383B;border:1px solid #33383B\">\n    <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"8\">\n      <div data-reveal=\"\" style=\"background:#1E2123;padding:28px;transition:background .3s\" style-hover=\"background:#26292C\">\n        <span style=\"width:30px;height:30px;display:block;background:#F26722;-webkit-mask:url({{ s.icon }}) center/contain no-repeat;mask:url({{ s.icon }}) center/contain no-repeat;margin-bottom:16px\"><\u002Fspan>\n        <div style=\"font-family:'Oswald',sans-serif;font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px\">{{ s.name }}<\u002Fdiv>\n        <p style=\"color:#8B9297;font-size:14.5px;line-height:1.6;margin:0\">{{ s.desc }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Why us -->\n<section id=\"why\" style=\"background:#0F1011;padding:90px 5vw\">\n  <div style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:54px;align-items:center\">\n    <div data-reveal=\"\">\n      <img src=\"63a27772-b34f-4ea0-807a-4f34731717ce\" alt=\"Engine bay\" style=\"width:100%;display:block;aspect-ratio:5/4;object-fit:cover;border:1px solid #33383B\">\n    <\u002Fdiv>\n    <div data-reveal=\"\">\n      <div style=\"color:#F26722;font-weight:700;font-size:13px;letter-spacing:2.5px;text-transform:uppercase\">The Redline difference<\u002Fdiv>\n      <h2 style=\"font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(32px,4vw,48px);margin:8px 0 22px;text-transform:uppercase;line-height:1.08\">You see everything we see<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <sc-for list=\"{{ whyItems }}\" as=\"w\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;gap:16px\">\n            <div style=\"width:44px;height:44px;flex:none;background:rgba(242,103,34,.12);border:1px solid rgba(242,103,34,.4);display:grid;place-items:center\">\n              <span style=\"width:22px;height:22px;background:#F26722;-webkit-mask:url({{ w.icon }}) center/contain no-repeat;mask:url({{ w.icon }}) center/contain no-repeat\"><\u002Fspan>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-weight:700;font-size:17px\">{{ w.title }}<\u002Fdiv>\n              <div style=\"color:#8B9297;font-size:14.5px;line-height:1.6\">{{ w.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Reviews -->\n<section id=\"reviews\" style=\"max-width:1240px;margin:0 auto;padding:90px 5vw\">\n  <div data-reveal=\"\" style=\"text-align:center;margin-bottom:44px\">\n    <div style=\"color:#F26722;font-weight:700;font-size:13px;letter-spacing:2.5px;text-transform:uppercase\">Straight from the reviews<\u002Fdiv>\n    <h2 style=\"font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(32px,4vw,48px);margin:8px 0 6px;text-transform:uppercase\">Phoenix drivers trust us<\u002Fh2>\n    <div style=\"color:#F5A623;font-size:20px;letter-spacing:3px\">★★★★★ <span style=\"color:#8B9297;font-size:14.5px;letter-spacing:0;font-weight:600\">4.9 · 850+ reviews<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px\">\n    <sc-for list=\"{{ reviews }}\" as=\"r\" hint-placeholder-count=\"3\">\n      <div data-reveal=\"\" style=\"background:#1E2123;border-left:3px solid #F26722;padding:26px\">\n        <div style=\"color:#F5A623;letter-spacing:2px;margin-bottom:12px\">★★★★★<\u002Fdiv>\n        <p style=\"color:#B8BEC2;font-size:15px;line-height:1.65;margin:0 0 16px\">“{{ r.text }}”<\u002Fp>\n        <div style=\"font-weight:700;font-size:14.5px\">{{ r.name }} <span style=\"color:#6C7378;font-weight:500\">· {{ r.car }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA -->\n<section style=\"background:#F26722;color:#0F1011;padding:70px 5vw\">\n  <div data-reveal=\"\" style=\"max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px\">\n    <div>\n      <h2 style=\"font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(30px,3.8vw,46px);margin:0 0 6px;text-transform:uppercase\">Hear a noise? Don't ignore it.<\u002Fh2>\n      <p style=\"margin:0;font-size:17px;font-weight:600\">Free quotes. Free shuttle. Same-week appointments.<\u002Fp>\n    <\u002Fdiv>\n    <a href=\"#quote\" style=\"background:#0F1011;color:#fff;font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;letter-spacing:1.5px;text-transform:uppercase;padding:17px 34px;white-space:nowrap\" style-hover=\"background:#fff;color:#0F1011\">Get my free quote ↑<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Footer -->\n<footer style=\"background:#0F1011;color:#6C7378;padding:48px 5vw;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;border-top:1px solid #26292C\">\n  <div style=\"font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;color:#E8EAEB;text-transform:uppercase\">Redline <span style=\"color:#F26722\">Auto Works<\u002Fspan><\u002Fdiv>\n  <div style=\"font-size:14px\">3390 E. University Dr, Phoenix, AZ · (602) 555-0147 · service@redlineautoworks.com<\u002Fdiv>\n  <div style=\"font-size:13.5px\">Mon–Fri 7:30am–6pm · Sat 8am–2pm<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { name: '', phone: '', vehicle: '', service: '', notes: '', done: false };\n\n  componentDidMount() {\n    const io = new IntersectionObserver((es) => {\n      es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } });\n    }, { threshold: 0.12 });\n    document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));\n    this._io = io;\n  }\n  componentWillUnmount() { if (this._io) this._io.disconnect(); }\n\n  renderVals() {\n    const ic = n => `https://unpkg.com/lucide-static@0.462.0/icons/${n}.svg`;\n    return {\n      formIdle: !this.state.done,\n      formDone: this.state.done,\n      doneName: this.state.name ? this.state.name.split(' ')[0] : 'friend',\n      fName: this.state.name, setName: e => this.setState({ name: e.target.value }),\n      fPhone: this.state.phone, setPhone: e => this.setState({ phone: e.target.value }),\n      fVehicle: this.state.vehicle, setVehicle: e => this.setState({ vehicle: e.target.value }),\n      fService: this.state.service, setService: e => this.setState({ service: e.target.value }),\n      fNotes: this.state.notes, setNotes: e => this.setState({ notes: e.target.value }),\n      submitForm: () => this.setState({ done: true }),\n      resetForm: () => this.setState({ done: false, name: '', phone: '', vehicle: '', service: '', notes: '' }),\n      heroStats: [\n        { val: '25+', label: 'Years in Phoenix' },\n        { val: '3yr/36k', label: 'Nationwide warranty' },\n        { val: '4.9★', label: '850+ reviews' },\n      ],\n      services: [\n        { icon: ic('circuit-board'), name: 'Diagnostics', desc: 'Dealer-grade scan tools pinpoint check-engine lights and electrical gremlins fast.' },\n        { icon: ic('disc'), name: 'Brakes', desc: 'Pads, rotors, calipers and lines — with a photo report of measured wear.' },\n        { icon: ic('droplet'), name: 'Oil & Maintenance', desc: 'Full-synthetic changes with a free 40-point inspection every visit.' },\n        { icon: ic('cog'), name: 'Engine Repair', desc: 'From timing chains to full rebuilds, done in-house by ASE master techs.' },\n        { icon: ic('git-merge'), name: 'Transmission', desc: 'Service, repair and replacement for automatics, manuals and CVTs.' },\n        { icon: ic('snowflake'), name: 'AC & Heating', desc: 'Recharge, leak detection and compressor work — vital in a Phoenix summer.' },\n        { icon: ic('battery-charging'), name: 'Electrical & Battery', desc: 'Starters, alternators, batteries and wiring, tested not guessed.' },\n        { icon: ic('life-buoy'), name: 'Steering & Suspension', desc: 'Shocks, struts, alignment and tires for a ride that tracks straight.' },\n      ],\n      whyItems: [\n        { icon: ic('camera'), title: 'Photo & video inspections', desc: 'Every quote comes with pictures of your actual car — see the worn part before you approve the work.' },\n        { icon: ic('file-check'), title: 'Written quotes, honored', desc: 'The price we text you is the price you pay. Any change gets your approval first.' },\n        { icon: ic('shield-check'), title: '3-year / 36k warranty', desc: 'Parts and labor covered nationwide — twice the industry standard.' },\n        { icon: ic('car'), title: 'Free shuttle & loaners', desc: 'Rides within 10 miles and loaner cars for repairs over a day. Life doesn\\u2019t stop for car trouble.' },\n      ],\n      reviews: [\n        { name: 'Carlos V.', car: '2018 F-150', text: 'They sent me a video of my brake pads next to a new set. First shop that ever SHOWED me why I needed the work. Fair price, done same day.' },\n        { name: 'Beth N.', car: '2020 CR-V', text: 'Dealer quoted $2,200. Redline diagnosed the real problem — a $240 sensor. That\\u2019s why they have my business for life.' },\n        { name: 'James O.', car: '2015 Silverado', text: 'AC died in July, 111° out. They squeezed me in next morning, shuttle to work, fixed by 3pm. Absolute lifesavers.' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
