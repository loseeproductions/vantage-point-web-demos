document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

F3;border-radius:16px;padding:26px;transition:transform .3s,box-shadow .3s\" style-hover=\"transform:translateY(-6px);box-shadow:0 18px 44px rgba(14,116,144,.12)\">\n        <div style=\"width:50px;height:50px;border-radius:12px;background:#E0F2F7;display:grid;place-items:center;margin-bottom:16px\">\n          <span style=\"width:25px;height:25px;background:#0E7490;-webkit-mask:url({{ s.icon }}) center/contain no-repeat;mask:url({{ s.icon }}) center/contain no-repeat\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:19px;margin-bottom:8px\">{{ s.name }}<\u002Fdiv>\n        <p style=\"color:#4A6373;font-size:15px;line-height:1.6;margin:0\">{{ s.desc }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Comfort plans -->\n<section id=\"plans\" style=\"background:#0E1F2B;color:#fff;padding:90px 5vw\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <div data-reveal=\"\" style=\"text-align:center;max-width:620px;margin:0 auto 50px\">\n      <div style=\"color:#5EEAD4;font-weight:700;font-size:13.5px;letter-spacing:2px;text-transform:uppercase\">Comfort Club<\u002Fdiv>\n      <h2 style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(30px,3.6vw,44px);margin:10px 0 12px\">Maintenance plans that pay for themselves<\u002Fh2>\n      <p style=\"color:#8FA9B8;font-size:16.5px;line-height:1.6;margin:0\">Two tune-ups a year, priority scheduling, and 15% off every repair.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px;max-width:1000px;margin:0 auto\">\n      <sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div data-reveal=\"\" style=\"background:{{ p.bg }};border:1px solid {{ p.border }};border-radius:18px;padding:32px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"font-weight:700;font-size:14px;letter-spacing:1.5px;text-transform:u v style=\"color:#F5A623;letter-spacing:2px;margin-bottom:12px\">★★★★★<\u002Fdiv>\n          <p style=\"color:#2C4453;font-size:15px;line-height:1.65;margin:0 0 16px\">“{{ r.text }}”<\u002Fp>\n          <div style=\"font-weight:700;font-size:14.5px\">{{ r.name }} <span style=\"color:#7C93A3;font-weight:500\">· {{ r.city }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA + Footer -->\n<section style=\"padding:80px 5vw;text-align:center\">\n  <div data-reveal=\"\">\n    <h2 style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(30px,3.8vw,46px);margin:0 0 12px\">Your comfort is one click away<\u002Fh2>\n    <p style=\"color:#4A6373;font-size:17px;margin:0 0 28px\">Next available appointment: <strong style=\"color:#0E7490\">tomorrow morning<\u002Fstrong><\u002Fp>\n    <button onclick=\"{{ openBooking }}\" style=\"background:#0E7490;color:#fff;border:none;cursor:pointer;font:inherit;font-weight:700;font-size:18px;padding:18px 36px;border-radius:14px;box-shadow:0 12px 28px rgba(14,116,144,.3)\" style-hover=\"background:#0A5A70;transform:translateY(-2px)\">Book with AI Assistant<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsection>\n<footer style=\"background:#0E1F2B;color:#8FA9B8;padding:48px 5vw;display:flex;flex-wrap:wrap;gap:30px;justify-content:space-between;align-items:center\">\n  <div style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:18px;color:#fff\">Northwind Heating &amp; Air<\u002Fdiv>\n  <div style=\"font-size:14px\">4402 Brighton Blvd, Denver, CO · (720) 555-0178 · hello@northwindhvac.com<\u002Fdiv>\n  <div style=\"font-size:13px\">Licensed &amp; insured · CO Lic. #HV-77219<\u002Fdiv>\n<\u002Ffooter>\n\n<!-- Booking modal -->\n<sc-if value=\"{{ bookingOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:100;background:rgba(14,31,43,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px\" onclick=\"{{ closeBookingBackdrop }}\">\n    <div style=\"background:#fff;border-radius:20px;width:min(440px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:slideIn .3s ease\" onclick=\"{{ stopProp }}\">\n      <div style=\"background:linear-gradient(135deg,#0E7490,#155E75);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:12px\">\n        <div style=\"width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center\">\n          <span style=\"width:20px;height:20px;background:#fff;-webkit-mask:url(&quot;4c396ca4-11c5-40a3-831f-65b5b3c27822&quot;) center/contain no-repeat;mask:url(&quot;4c396ca4-11c5-40a3-831f-65b5b3c27822&quot;) center/contain no-repeat\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1\">\n          <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:16px\">Nova — Booking Assistant<\u002Fdiv>\n          <div style=\"font-size:12.5px;opacity:.85\">Online · replies instantly<\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ closeBooking }}\" style=\"background:rgba(255,255,255,.15);border:none;cursor:pointer;color:#fff;width:30px;height:30px;border-radius:8px;font-size:16px;line-height:1\" style-hover=\"background:rgba(255,255,255,.3)\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background:#F5FAFC\" data-chat-scroll=\"\">\n        <sc-for list=\"{{ chatLog }}\" as=\"m\">\n          <sc-if value=\"{{ m.bot }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"align-self:flex-start;max-width:85%;background:#fff;border:1px solid #E3EDF3;border-radius:4px 16px 16px 16px;padding:12px 15px;font-size:14.5px;line-height:1.55;color:#1E3542;animation:slideIn .3s ease;white-space:pre-line\">{{ m.text }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ m.user }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"align-self:flex-end;max-width:85%;background:#0E7490;color:#fff;border-radius:16px 4px 16px 16px;padding:12px 15px;font-size:14.5px;line-height:1.55;animation:slideIn .3s ease\">{{ m.text }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ typing }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"align-self:flex-start;background:#fff;border:1px solid #E3EDF3;border-radius:4px 16px 16px 16px;padding:12px 16px;color:#7C93A3;font-size:14px\">Nova is typing…<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"padding:14px 16px;background:#fff;border-top:1px solid #E3EDF3;display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ chips }}\" as=\"c\">\n          <button onclick=\"{{ c.go }}\" style=\"background:#E0F2F7;color:#0E7490;border:1px solid #BCE0EA;cursor:pointer;font:inherit;font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:999px\" style-hover=\"background:#0E7490;color:#fff\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { open: false, node: 'start', log: [], typing: false };\n\n  componentDidMount() {\n    const io = new IntersectionObserver((es) => {\n      es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } });\n    }, { threshold: 0.12 });\n    document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));\n    this._io = io;\n  }\n  componentWillUnmount() { if (this._io) this._io.disconnect(); clearTimeout(this._t); }\n\n  script() {\n    return {\n      start: { bot: \"Hi! I'm Nova, Northwind's booking assistant. 👋 I can get you on the schedule in under a minute. What do you need help with?\", chips: [\n        ['My AC isn\\u2019t cooling', 'ac'], ['Furnace tune-up', 'tune'], ['New system quote', 'quote']] },\n      ac: { bot: \"Sorry to hear that — no cooling in July is no fun. I checked the schedule: we have a repair tech available TOMORROW.\\n\\nWhich window works best?\", chips: [\n        ['Tomorrow 9–11am', 'slot1'], ['Tomorrow 1–3pm', 'slot2'], ['Something later this week', 'slot3']] },\n      tune: { bot: \"Great choice — a fall tune-up cuts breakdown risk by ~70%. Tune-up visits are $89, waived if you join the Comfort Club.\\n\\nHere are the next openings:\", chips: [\n        ['Thu 8–10am', 'slot1'], ['Fri 10am–12pm', 'slot2'], ['Next Monday', 'slot3']] },\n      quote: { bot: \"Happy to help! New system consultations are free, take about 45 minutes, and come with a same-day written quote.\\n\\nWhen should our comfort advisor stop by?\", chips: [\n        ['Tomorrow afternoon', 'slot2'], ['Saturday morning', 'slot1'], ['Next week', 'slot3']] },\n      slot1: { bot: \"Perfect — I'm holding that slot for you. Can I grab a name and number for the confirmation text?\", chips: [['Alex Carter · (720) 555-0142', 'confirm']] },\n      slot2: { bot: \"Great — that window is yours. Can I grab a name and number for the confirmation text?\", chips: [['Alex Carter · (720) 555-0142', 'confirm']] },\n      slot3: { bot: \"No problem — I found an opening later in the week and I'm holding it. Can I grab a name and number for the confirmation?\", chips: [['Alex Carter · (720) 555-0142', 'confirm']] },\n      confirm: { bot: \"✅ You're all set, Alex!\\n\\nAppointment confirmed\\nTechnician: Marcus J. (4.9★)\\nYou'll get a text confirmation plus a 30-min heads-up when he's on the way.\\n\\nAnything else I can help with?\", chips: [['Book another visit', 'start'], ['No, that\\u2019s all — thanks!', 'bye']] },\n      bye: { bot: \"You're welcome! See you soon — stay comfortable out there. 🌡️\", chips: [['Start over', 'start']] },\n    };\n  }\n\n  go(nodeKey, userText) {\n    const node = this.script()[nodeKey];\n    this.setState(s => ({\n      log: userText ? [...s.log, { user: true, bot: false, text: userText }] : s.log,\n      typing: true, node: nodeKey,\n    }));\n    clearTimeout(this._t);\n    this._t = setTimeout(() => {\n      this.setState(s => ({ typing: false, log: [...s.log, { bot: true, user: false, text: node.bot }] }));\n      this.scrollChat();\n    }, 700);\n    this.scrollChat();\n  }\n  scrollChat() {\n    setTimeout(() => {\n      const el = document.querySelector('[data-chat-scroll]');\n      if (el) el.scrollTop = el.scrollHeight;\n    }, 60);\n  }\n\n  renderVals() {\n    const ic = n => `https://unpkg.com/lucide-static@0.462.0/icons/${n}.svg`;\n    const node = this.script()[this.state.node];\n    const chips = this.state.typing ? [] : node.chips.map(([label, key]) => ({ label, go: () => this.go(key, label) }));\n    return {\n      bookingOpen: this.state.open,\n      chatLog: this.state.log,\n      typing: this.state.typing,\n      chips,\n      openBooking: () => {\n        const fresh = this.state.log.length === 0;\n        this.setState({ open: true });\n        if (fresh) this.go('start', null);\n      },\n      closeBooking: () => this.setState({ open: false }),\n      closeBookingBackdrop: (e) => { if (e.target === e.currentTarget) this.setState({ open: false }); },\n      stopProp: (e) => e.stopPropagation(),\n      services: [\n        { icon: ic('snowflake'), name: 'AC Repair & Install', desc: 'Fast diagnosis and repair of all brands, plus high-efficiency replacements sized right for your home.' },\n        { icon: ic('flame'), name: 'Furnace & Heating', desc: 'Repairs, tune-ups and installs that keep you warm through the coldest Colorado nights.' },\n        { icon: ic('leaf'), name: 'Heat Pumps', desc: 'Ultra-efficient heating and cooling in one system — rebates up to $2,400 available now.' },\n        { icon: ic('wind'), name: 'Air Quality', desc: 'Whole-home filtration, humidifiers and UV purification for cleaner, healthier air.' },\n        { icon: ic('gauge'), name: 'Smart Thermostats', desc: 'Professional install and setup so your system heats and cools only when it needs to.' },\n        { icon: ic('wrench'), name: 'Tune-Ups & Maintenance', desc: '21-point seasonal inspections that catch small problems before they become breakdowns.' },\n      ],\n      plans: [\n        { name: 'Essential', price: '$14', bg: 'rgba(255,255,255,.04)', border: 'rgba(255,255,255,.12)', labelColor: '#8FA9B8', btnBg: 'rgba(255,255,255,.1)', btnColor: '#fff',\n          features: ['1 tune-up per year', '10% off repairs', 'No overtime fees', 'Reminder scheduling'] },\n        { name: 'Comfort Club', price: '$24', bg: 'linear-gradient(160deg,#0E7490,#0A5A70)', border: '#2AA5C4', labelColor: '#5EEAD4', btnBg: '#fff', btnColor: '#0E7490',\n          features: ['2 tune-ups per year', '15% off repairs', 'Priority same-day scheduling', 'Free filter replacements'] },\n        { name: 'Total Home', price: '$39', bg: 'rgba(255,255,255,.04)', border: 'rgba(255,255,255,.12)', labelColor: '#8FA9B8', btnBg: 'rgba(255,255,255,.1)', btnColor: '#fff',\n          features: ['Everything in Comfort Club', 'Plumbing & electrical checks', '20% off all repairs', '$500 new-system credit'] },\n      ],\n      steps: [\n        { n: '1', title: 'Tell Nova what\\u2019s wrong', desc: 'Describe the problem in plain English — no forms, no menus, no hold music.' },\n        { n: '2', title: 'Pick a real-time slot', desc: 'Nova reads our live dispatch board and offers you actual open windows.' },\n        { n: '3', title: 'Get confirmed instantly', desc: 'Text confirmation with your technician\\u2019s name, photo and arrival tracking.' },\n      ],\n      reviews: [\n        { name: 'Miguel A.', city: 'Aurora', text: 'Booked through the chat assistant at 11pm, tech was at my door by 10am. The future is now. AC fixed same visit.' },\n        { name: 'Jenny K.', city: 'Lakewood', text: 'The booking bot actually worked — picked my time, got a text with the tech\\u2019s photo. Furnace tun
